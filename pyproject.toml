[project]
name = "db-agents-cli"
version = "0.1.0"
description = "Sync tool for DB-AGENTS metadata"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.6.0",
    "python-frontmatter>=1.1.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "pre-commit>=3.0.0",
]

# Database drivers (user installs as needed)
postgres = ["psycopg2-binary>=2.9.9"]
mysql = ["pymysql>=1.1.0"]
snowflake = ["snowflake-sqlalchemy>=1.5.0"]
bigquery = ["sqlalchemy-bigquery>=1.9.0"]

[project.scripts]
db-agents = "db_agents_cli.main:app"
dba = "db_agents_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
